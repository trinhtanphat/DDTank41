name: VIP20 server gate

on:
  pull_request:
    paths:
      - 'Bussiness/GameProperties.cs'
      - 'Game.Server/GamePlayer.cs'
      - 'Game.Server/Packets/Client/OpenVipHandler.cs'
      - 'Database/20260918_v389_vip20.sql'
      - 'tests/vip20-server-smoke.ps1'
      - '.github/workflows/vip20-server-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'Bussiness/GameProperties.cs'
      - 'Game.Server/GamePlayer.cs'
      - 'Game.Server/Packets/Client/OpenVipHandler.cs'
      - 'Database/20260918_v389_vip20.sql'
      - 'tests/vip20-server-smoke.ps1'

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate server VIP20 invariants
        shell: pwsh
        run: ./tests/vip20-server-smoke.ps1
